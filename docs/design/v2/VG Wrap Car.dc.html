<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;aspect-ratio:800/275;background:#1C1D21;overflow:hidden"><canvas ref="{{ cv }}" width="800" height="275" style="width:100%;height:100%;display:block"></canvas></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:275},&quot;body&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;sedan&quot;,&quot;options&quot;:[&quot;hatch&quot;,&quot;sedan&quot;,&quot;station&quot;,&quot;suv&quot;,&quot;bus&quot;,&quot;coach&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;hex&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#15213D&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0A0A0B&quot;,&quot;#ECE9E1&quot;,&quot;#15213D&quot;,&quot;#B3122E&quot;]},&quot;finish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;satijn&quot;,&quot;options&quot;:[&quot;glans&quot;,&quot;satijn&quot;,&quot;mat&quot;,&quot;metallic&quot;,&quot;carbon&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;full&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dak&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;spiegel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;chroom&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pakket&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mini&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(p){ super(p); this.cv = React.createRef(); this.alive = true; }
  componentDidMount(){ this.draw(); }
  componentDidUpdate(){ this.draw(); }
  componentWillUnmount(){ this.alive = false; }
  static cache(){ return (window.__vgCarCache5 = window.__vgCarCache5 || {}); }
  load(body){
    const C = Component.cache();
    if (C[body]) return C[body];
    const W=800, H=275;
    C[body] = new Promise(res=>{
      const img = new Image();
      img.onload = () => {
        const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.drawImage(img,0,0,W,H);
        const d=x.getImageData(0,0,W,H).data, N=W*H;
        const L=new Float32Array(N), cand=new Uint8Array(N), dark=new Uint8Array(N);
        for(let i=0;i<N;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];const l=.299*r+.587*g+.114*b;L[i]=l;const s=Math.max(r,g,b)-Math.min(r,g,b);cand[i]=(l>108&&s<36)?1:0;dark[i]=l<62?1:0;}
        // car bbox and column tops
        const top=new Int16Array(W).fill(-1); let left=W,right=0,carTop=H;
        for(let xx=0;xx<W;xx++){let cnt=0;for(let y=0;y<H*0.8;y++){if(cand[y*W+xx]){cnt++;if(top[xx]<0)top[xx]=y;}} if(cnt>4){left=Math.min(left,xx);right=Math.max(right,xx);if(top[xx]>=0)carTop=Math.min(carTop,top[xx]);}}
        const ground=H-1, h=Math.round(H*0.975)-carTop, cw=right-left;
        // radius sits mid-tyre: rim fully inside, rubber outside is dark anyway, so no white crescent on the arch
        const WH={hatch:[[149,206,57],[645,205,59]],sedan:[[149,206,56],[643,205,58]],station:[[150,205,58],[636,205,58]],suv:[[147,213,49],[637,213,49]],bus:[[160,243,25],[585,243,25]],coach:[[170,236,31],[561,236,31]]}[body]||[[150,206,58],[640,205,58]];
        const wh=WH.map(([cx,cy,r])=>({cx,cy,r}));
        const MB={hatch:[280,317,82,104],sedan:[283,315,84,104],station:[282,316,84,104],suv:[280,320,77,102],bus:[204,222,111,143],coach:[27,43,95,133]}[body]||[282,316,82,104];
        const darkMirror = body==="bus"||body==="coach";
        const belt=carTop+h*0.55;
        // glass
        const glass=new Uint8Array(N);
        for(let xx=left;xx<=right;xx++){let y=carTop;while(y<belt){if(L[y*W+xx]<88&&top[xx]>=0&&top[xx]<y){let y2=y;while(y2<belt&&L[y2*W+xx]<88)y2++; if(y2-y>=7){let below=false;for(let yy=y2;yy<Math.min(H,y2+h*0.6);yy++){if(cand[yy*W+xx]){below=true;break;}} if(below)for(let k=y;k<y2;k++)glass[k*W+xx]=1;} y=y2;} else y++;}}
        const mask=new Uint8Array(N); const lum=[];
        const roofT=Math.max(8,h*0.09);
        const glassTop=new Int16Array(W).fill(H);
        for(let xx=0;xx<W;xx++)for(let y=0;y<H;y++){if(glass[y*W+xx]){glassTop[xx]=y;break;}}
        const lum3=[];
        for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=y*W+xx;
          if(darkMirror&&xx>=MB[0]&&xx<=MB[1]&&y>=MB[2]&&y<=MB[3]&&L[i]>34){mask[i]=3;lum3.push(L[i]);continue;}
          if(!cand[i]||xx<left||xx>right||y<carTop||y>ground+2)continue;
          let inWheel=false;for(const w of wh){const dx=xx-w.cx,dy=y-w.cy;if(dx*dx+dy*dy<w.r*w.r)inWheel=true;} if(inWheel)continue;
          let m=1;
          if(xx>=MB[0]&&xx<=MB[1]&&y>=MB[2]&&y<=MB[3])m=3;
          else if(top[xx]>=0&&top[xx]<=carTop+h*0.16){const dz=(top[xx]-carTop)/(h*0.16);const th=3+(roofT-3)*Math.pow(1-dz,1.6);if(y<=Math.min(top[xx]+th,glassTop[xx]-1))m=2;}
          else if(y<belt+6){let near=false;for(let dy=-4;dy<=4&&!near;dy++)for(let dx=-4;dx<=4;dx++){const yy=y+dy,x2=xx+dx;if(yy>=0&&yy<H&&x2>=0&&x2<W&&glass[yy*W+x2]){near=true;break;}} if(near)m=4;}
          mask[i]=m; if(m===1)lum.push(L[i]); if(m===3)lum3.push(L[i]);}
        lum.sort((a,b)=>a-b); const ref=lum.length?lum[Math.floor(lum.length*0.7)]:215;
        lum3.sort((a,b)=>a-b); const ref3=lum3.length?lum3[Math.floor(lum3.length*0.85)]:ref;
        const gamma = {bus:.72,coach:.85}[body] || 1;
        // soft edges: dilate zones by 1px, blur a coverage weight, smooth luminance
        const zone=new Uint8Array(N);
        for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const i=y*W+xx;let m=mask[i];if(!m){for(let dy=-1;dy<=1&&!m;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,x2=xx+dx;if(yy>=0&&yy<H&&x2>=0&&x2<W&&mask[yy*W+x2]){m=mask[yy*W+x2];break;}}}zone[i]=m;}
        let w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=mask[i]?1:0;
        const blur=(src)=>{const t=new Float32Array(N);for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){let s=0,n=0;for(let dy=-1;dy<=1;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;for(let dx=-1;dx<=1;dx++){const x2=xx+dx;if(x2<0||x2>=W)continue;s+=src[yy*W+x2];n++;}}t[y*W+xx]=s/n;}return t;};
        w=blur(blur(w));
        const Ls=blur(L);
        res({data:d,mask:zone,w,Ls,ref,ref3,gamma,W,H});
      };
      img.src="assets/cars/"+body+".png";
    });
    return C[body];
  }
  draw(){
    const P=this.props, body=P.body??"sedan";
    this.load(body).then(B=>{
      if(!this.alive||!this.cv.current)return;
      const hex=P.hex??"#15213D", fin=P.finish??"satijn", full=P.full??true, pakket=!!P.pakket;
      const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
      const zoneC=pakket?rgb("#0A0A0B"):rgb(hex), zoneF=pakket?"glans":fin;
      const T=[null, full?[rgb(hex),fin]:null, full?[rgb(hex),fin]:(P.dak?[zoneC,zoneF]:null), full?[rgb(hex),fin]:(P.spiegel?[zoneC,zoneF]:null), (full||P.chroom)?[rgb("#0E0F11"),"glans"]:null];
      const ENV={glans:.1,satijn:.08,mat:.05,metallic:.1,carbon:.07}, SPK={glans:1,satijn:.45,mat:.08,metallic:.8,carbon:.4};
      const {data,mask,w,Ls,ref,ref3,gamma,W,H}=B; const out=new Uint8ClampedArray(data);
      for(let i=0;i<W*H;i++){const m=mask[i];if(!m)continue;const t=T[m];if(!t)continue;const wi=w[i];if(wi<.02)continue;const [C,f]=t;
        const l=Math.pow(Ls[i]/(m===3?ref3:ref),m===3?1:gamma);
        let s=l;const x=i%W,y=(i/W)|0;
        if(f==="glans")s=Math.pow(l,1.15);else if(f==="mat")s=.45+.55*Math.min(l,1.02);else if(f==="satijn")s=Math.min(l,1.12);else if(f==="metallic")s=Math.pow(Math.min(l,1.15),1.1)+((((x*73+y*151)^(x*y))&7)/7-.5)*.09;else if(f==="carbon"){const bx=(x/6)|0,by=(y/6)|0,hz=((bx+by)&1)===0;const t=hz?((x%6)/5):((y%6)/5);s=Math.min(l,1.08)*(.62+.38*(.35+.65*Math.abs(t-.5)*2));}
        const spec=Math.max(0,Math.min(1,(l-1.03)/.12))*SPK[f], env=ENV[f];
        for(let k=0;k<3;k++){let v=C[k]*s+env*s*s*(1-C[k])+spec*.9;v=Math.max(0,Math.min(255,v*255));out[i*4+k]=data[i*4+k]+(v-data[i*4+k])*wi;}
      }
      const ctx=this.cv.current.getContext("2d"); ctx.putImageData(new ImageData(out,W,H),0,0);
    }).catch(e=>console.error("VG Wrap Car",e));
  }
  renderVals(){ return { cv:this.cv }; }
}
</script>
</body>
</html>
