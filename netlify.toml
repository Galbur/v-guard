[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# UA wrap page moved to a native slug (step W3). Must stay above the /uk/* 404 rule.
[[redirects]]
  from = "/uk/car-wrapping"
  to = "/uk/obkleiuvannia/"
  status = 301
  force = true

[[redirects]]
  from = "/uk/car-wrapping/"
  to = "/uk/obkleiuvannia/"
  status = 301
  force = true

# Ukrainian 404 for unknown /uk/ paths; root 404.html covers the rest.
# Not forced, so existing files are never shadowed.
[[redirects]]
  from = "/uk/*"
  to = "/uk/404/"
  status = 404

# No third-party origins (D7), except analytics after consent in the banner (D30): GA4 and GTM
# (googletagmanager.com, google-analytics.com) and Microsoft Clarity (clarity.ms, c.bing.com).
# Nothing from them loads before consent (src/components/Analytics.astro).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.clarity.ms https://c.bing.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
